server {
    listen 80;
    server_name _;

    root /var/www/sound-money-maps/dist;
    index index.html;

    # Serve static assets with long cache
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # SPA fallback: route all requests to index.html
    location / {
        try_files $uri $uri/ /index.html;
    }
}
